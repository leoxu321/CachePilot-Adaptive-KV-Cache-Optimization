[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "cachepilot"
version = "0.2.0"
description = "Hardware-Aware LLM Inference Tuning"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
inference = ["torch==2.10.0", "transformers==4.57.6", "accelerate==1.12.0", "bitsandbytes==0.49.2"]
test = ["pytest==9.0.2"]

[project.scripts]
cachepilot = "cachepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cachepilot = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
